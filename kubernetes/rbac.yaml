# Least-privilege RBAC for the AI Ops MCP server, bound to the Kubernetes groups that the
# ECS task role's EKS access entry maps to. Namespace-scoped: nothing outside "application".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-mcp-investigate
  namespace: application
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services/proxy"]   # check_app_health: HTTP GET through the API server
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-mcp-remediate
  namespace: application
rules:
  - apiGroups: [""]
    resources: ["pods"]              # restart_pod
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"] # scale_deployment
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]       # rollout restart, rollback, resources, set_image
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-mcp-investigate-binding
  namespace: application
subjects:
  - kind: Group
    name: aiops-mcp-investigate
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: aiops-mcp-investigate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-mcp-remediate-binding
  namespace: application
subjects:
  - kind: Group
    name: aiops-mcp-remediate
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: aiops-mcp-remediate
  apiGroup: rbac.authorization.k8s.io
